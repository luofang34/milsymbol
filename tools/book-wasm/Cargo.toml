[package]
name = "milsymbol-book"
version = "0.0.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"
description = "Native Rust renderer and catalog bridge for the milsymbol book"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
milsymbol = { path = "../..", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
wasm-bindgen = "=0.2.130"

[lints]
workspace = true
