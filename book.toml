[book]
title = "milsymbol usage manual"
authors = ["Fang Luo"]
description = "Using native Rust military symbology in applications, maps, and renderers"
language = "en"
src = "docs"

[build]
build-dir = "target/book"

[rust]
edition = "2024"

[output.html]
site-url = "/milsymbol/"
git-repository-url = "https://github.com/luofang34/milsymbol"
edit-url-template = "https://github.com/luofang34/milsymbol/edit/main/{path}"

[output.html.playground]
runnable = false
