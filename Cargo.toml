[package]
name = "milsymbol"
version = "0.3.1"
authors = ["Fang Luo"]
edition = "2024"
rust-version = "1.85"
description = "Native Rust port of milsymbol.js: MIL-STD-2525 / APP-6 military symbol generation"
license = "AGPL-3.0-or-later"
repository = "https://github.com/luofang34/milsymbol"
readme = "README.md"
keywords = ["milsymbol", "mil-std-2525", "app-6", "symbology", "svg"]
categories = ["graphics", "rendering", "no-std"]
documentation = "https://docs.rs/milsymbol"
homepage = "https://github.com/luofang34/milsymbol"
# Large differential fixtures and their test target stay in the repository.
# The package includes the other tests and their reference data, examples,
# benches and documentation; README images use absolute URLs.
include = [
    "/src/**/*.rs",
    "/src/lib.md",
    "/tests/**/*.rs",
    "!/tests/corpus.rs",
    "/tests/data/*.txt",
    "/examples/*.rs",
    "/benches/*.rs",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/UPSTREAM.md",
    "/BENCHMARKS.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/LICENSE-MIT-milsymbol",
    "/LICENSE-BSD-V8",
    "/NOTICE",
    "/clippy.toml",
]

[features]
default = ["std"]
# `std` only adds the `cache` module; the core is `no_std + alloc`.
std = []
# Serialize and deserialize options, configuration and the drawing view.
serde = ["dep:serde"]
# Embed path data in a packed form (about a third of the text size) and
# decode it when it is serialized or parsed, trading CPU for flash.
compact-paths = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
libm = "0.2.16"
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"], optional = true }

[dev-dependencies]
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
flate2 = "1.1.10"
proptest = "1.11.0"
criterion = { version = "0.8.2", default-features = false }
dhat = "0.3.3"

[[bench]]
name = "render"
harness = false
required-features = ["std"]

[[test]]
name = "allocations"
harness = false

[[example]]
name = "footprint"
required-features = ["std"]

[lints]
workspace = true

[workspace]
members = [".", "xtask"]

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)"] }
missing_docs = "warn"
let_underscore_drop = "warn"
dead_code = "deny"
unused = { level = "deny", priority = -1 }
unreachable_pub = "deny"
missing_debug_implementations = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "deny"
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"
unwrap_in_result = "forbid"
get_unwrap = "forbid"
indexing_slicing = "forbid"
string_slice = "forbid"
todo = "forbid"
unimplemented = "forbid"
unreachable = "forbid"
exit = "forbid"
mem_forget = "forbid"
let_underscore_must_use = "deny"
let_underscore_future = "deny"
await_holding_lock = "deny"
too_many_lines = "deny"
