name: CI

on:
  push:
    branches: [main, ci-debug-alloc]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  native:
    name: fmt → clippy → test → doc → release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: tools/ci/check.sh

  lint:
    name: clippy on ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, beta]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: tools/ci/lint.sh ${{ matrix.toolchain }}

  targets:
    name: wasm32 and no_std builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, thumbv7em-none-eabihf, thumbv6m-none-eabi
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --lib --target wasm32-unknown-unknown
      - run: cargo build --lib --no-default-features --target wasm32-unknown-unknown
      - run: cargo build --lib --no-default-features --target thumbv7em-none-eabihf
      - run: cargo build --lib --no-default-features --target thumbv6m-none-eabi
      - run: cargo build --lib --features serde --target wasm32-unknown-unknown
      - run: cargo build --lib --no-default-features --features serde --target wasm32-unknown-unknown
      - run: cargo build --lib --no-default-features --features serde --target thumbv7em-none-eabihf
      - run: cargo build --lib --no-default-features --features serde --target thumbv6m-none-eabi

  msrv:
    name: library builds on rust-version (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.85
        with:
          components: clippy
      - run: cargo build --lib
      - run: tools/ci/lint.sh default:lib
      - run: cargo build --lib --no-default-features
      - run: cargo build --lib --all-features

  features:
    name: every feature combination builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-hack
      - uses: Swatinem/rust-cache@v2
      - run: cargo hack check -p milsymbol --feature-powerset --no-dev-deps

  semver:
    name: public API is compatible with the last release
    runs-on: ubuntu-latest
    # Breaking changes are allowed only with a version bump: cargo-semver-checks
    # compares against the newest published release and honours the bump.
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: milsymbol

  fuzz:
    name: fuzz targets build and run briefly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-fuzz --locked
      - run: |
          for target in sidc_parse render set_option; do
            cargo fuzz run "$target" -- -max_total_time=30
          done

  package:
    name: crates.io package builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish --dry-run -p milsymbol
      - run: cargo package -p milsymbol
      - name: Package stays small and omits repository-only corpus
        run: |
          crate=target/package/milsymbol-$(cargo pkgid -p milsymbol | sed 's/.*[#@]//').crate
          test -f "$crate"
          size=$(stat -c %s "$crate")
          echo "$crate: $size bytes"
          test "$size" -lt 1000000
          if tar -tzf "$crate" | grep -E '/tests/corpus([/.]|$)'; then
            echo "::error::differential corpus must stay in the repository"
            exit 1
          fi
          echo "CRATE=$crate" >> "$GITHUB_ENV"
      # The full corpus runs in the native and oracle jobs. Every test that
      # ships must compile and run using the packaged files alone.
      - name: Tests build and run from the packaged crate
        run: |
          mkdir -p /tmp/pkg
          tar -xzf "$CRATE" -C /tmp/pkg
          cd /tmp/pkg/milsymbol-*
          CARGO_TARGET_DIR=/tmp/pkg/target cargo test --locked --all-targets --no-run
          CARGO_TARGET_DIR=/tmp/pkg/target cargo test --locked --all-targets
          CARGO_TARGET_DIR=/tmp/pkg/target cargo test --locked --doc

  js-guard:
    name: no JavaScript runtime in dependency tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: tools/ci/js-guard.sh

  oracle:
    name: regenerate from pinned milsymbol.js and diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Regenerate tables
        run: tools/codegen/regenerate.sh
        env:
          BASELINES: "200"
          CHECKS: "800"
      - name: Generated tables are up to date
        run: git diff --exit-code -- src/generated
      - name: Live differential check against the oracle
        run: |
          for suite in invalid config options fuzz modifiers base direction known; do
            tools/oracle/diff.sh "$suite" 10
          done
      - name: Fixtures are up to date
        # Compare decompressed content: gzip bytes differ between zlib builds.
        run: |
          mkdir -p /tmp/committed
          cp tests/corpus/*.jsonl.gz /tmp/committed/
          node tools/oracle/fixtures.mjs invalid config options fuzz modifiers base direction
          for f in tests/corpus/*.jsonl.gz; do
            cmp <(gunzip -c "/tmp/committed/$(basename "$f")") <(gunzip -c "$f")
          done
