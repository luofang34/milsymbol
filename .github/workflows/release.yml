name: Release

# Publishes to crates.io when a version tag (v*) is pushed. The tagged
# commit must be on main and have a successful CI run; the crates-io
# environment only accepts v* tags (see RELEASING.md).
#
# Authentication, in order of preference:
#   1. Trusted Publishing (OIDC), once the repository variable
#      CRATES_IO_TRUSTED_PUBLISHING is "true" and the crate's trusted
#      publisher is configured on crates.io (see RELEASING.md).
#   2. The CARGO_REGISTRY_TOKEN secret (needed for the very first release:
#      crates.io only accepts Trusted Publishing for existing crates).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      actions: read # look up the CI run of the tagged commit
      id-token: write # OIDC token for Trusted Publishing
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Tagged commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main"
            exit 1
          fi
      - name: CI passed for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
            --commit "$GITHUB_SHA" --status success --json databaseId --jq length)
          if [ "$passed" -lt 1 ]; then
            echo "::error::no successful CI run for $GITHUB_SHA; wait for CI on main to pass, then re-run this job"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
      - name: Tag matches Cargo.toml version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "milsymbol") | .version')
          test "v$version" = "$GITHUB_REF_NAME"
      - run: cargo test --release -p milsymbol
      - name: Authenticate with Trusted Publishing
        if: vars.CRATES_IO_TRUSTED_PUBLISHING == 'true'
        id: trusted
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish
        run: cargo publish -p milsymbol
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.trusted.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
