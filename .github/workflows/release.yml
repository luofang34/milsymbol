name: Release

# A v* tag publishes to crates.io once the tagged commit is on main and has a
# successful CI run, authenticating through Trusted Publishing (OIDC) only.
# Manual runs from a v* tag check the token exchange and upload nothing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-trusted-publishing:
    name: Verify Trusted Publishing (no upload)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      id-token: write
    steps:
      - name: Authenticate with Trusted Publishing
        id: trusted
        uses: rust-lang/crates-io-auth-action@v1
      - name: Verify token exchange
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.trusted.outputs.token }}
        run: |
          test -n "$CARGO_REGISTRY_TOKEN"
          echo "OIDC token exchange succeeded; no crate was uploaded. The action revokes the token when this job ends." >> "$GITHUB_STEP_SUMMARY"

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      actions: read # look up the CI run of the tagged commit
      id-token: write # OIDC token for Trusted Publishing
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Tagged commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main"
            exit 1
          fi
      - name: CI passed for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
            --commit "$GITHUB_SHA" --status success --json databaseId --jq length)
          if [ "$passed" -lt 1 ]; then
            echo "::error::no successful CI run for $GITHUB_SHA; wait for CI on main to pass, then re-run this job"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
      - name: Tag matches Cargo.toml version
        run: test "v$(tools/ci/crate.sh version)" = "$GITHUB_REF_NAME"
      - name: Changelog entry is dated
        run: tools/ci/changelog.sh --release
      - run: cargo test --locked --release -p "$(tools/ci/crate.sh name)"
      - name: Authenticate with Trusted Publishing
        id: trusted
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish
        run: cargo publish --locked -p "$(tools/ci/crate.sh name)"
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.trusted.outputs.token }}

  github-release:
    # After the crate is on crates.io, so a GitHub release never announces a
    # version that failed to publish.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@v5
      - name: Release notes from the changelog entry
        run: tools/ci/changelog.sh --release --notes > "$RUNNER_TEMP/notes.md"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$(tools/ci/crate.sh name) ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/notes.md"
